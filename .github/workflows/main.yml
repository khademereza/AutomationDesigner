name: Build AutomationDesigner

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:

    runs-on: windows-latest

    steps:
    - name: Checkout source code
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Restore NuGet packages
      run: nuget restore AutomationDesigner.sln

    - name: Disable VSTO signing verification
      shell: powershell
      run: |
        $targets = "C:\Program Files\Microsoft Visual Studio\18\Enterprise\MSBuild\Microsoft\VisualStudio\v18.0\OfficeTools\Microsoft.VisualStudio.Tools.Office.targets"

        Write-Host "Patching: $targets"

        $content = Get-Content $targets -Raw

        $content = $content -replace `
          '<Target Name="VerifyClickOnceSigningSettings"', `
          '<Target Name="VerifyClickOnceSigningSettings" Condition="''$(SignManifests)'' != ''false''"'

        Set-Content $targets $content -Encoding UTF8

        Write-Host "VSTO signing verification patched."

    - name: Build AutomationDesigner
      run: msbuild AutomationDesigner.sln /p:Configuration=Release /p:SignManifests=false
