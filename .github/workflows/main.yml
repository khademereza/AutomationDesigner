name: Build AutomationDesigner

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

  workflow_dispatch:

jobs:
  build:

    runs-on: windows-latest

    steps:

    - name: Checkout source code
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Restore NuGet packages
      run: nuget restore AutomationDesigner.sln

    - name: Disable VSTO signing verification
      shell: powershell
      run: |
        $targets = "C:\Program Files\Microsoft Visual Studio\18\Enterprise\MSBuild\Microsoft\VisualStudio\v18.0\OfficeTools\Microsoft.VisualStudio.Tools.Office.targets"

        Write-Host "Patching VSTO targets file:"
        Write-Host $targets

        $content = Get-Content $targets -Raw

        $old = '<VerifyClickOnceSigningSettings SignManifests="$(SignManifests)" ' + "`r`n" + '        />'

        $new = '<VerifyClickOnceSigningSettings SignManifests="$(SignManifests)" Condition="''$(SignManifests)'' != ''false''" />'

        if ($content.Contains($old)) {
            $content = $content.Replace($old, $new)

            Set-Content `
                -Path $targets `
                -Value $content `
                -Encoding UTF8

            Write-Host "VSTO signing verification successfully disabled."
        }
        else {
            Write-Error "The expected VerifyClickOnceSigningSettings block was not found."
            exit 1
        }

    - name: Build AutomationDesigner
      run: msbuild AutomationDesigner.sln /p:Configuration=Release /p:SignManifests=false

    - name: Upload AutomationDesigner
      uses: actions/upload-artifact@v4
      with:
        name: AutomationDesigner
        path: AutomationDesigner/bin/Release/*
