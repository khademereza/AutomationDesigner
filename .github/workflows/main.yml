name: Build AutomationDesigner

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:

    runs-on: windows-latest

    steps:
    - name: Checkout source code
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Restore NuGet packages
      run: nuget restore AutomationDesigner.sln

    - name: Inspect VSTO target
      shell: powershell
      run: |
        $targets = "C:\Program Files\Microsoft Visual Studio\18\Enterprise\MSBuild\Microsoft\VisualStudio\v18.0\OfficeTools\Microsoft.VisualStudio.Tools.Office.targets"

        Write-Host "=== Lines 145 to 180 ==="

        $lines = Get-Content $targets

        for ($i = 144; $i -lt 180; $i++) {
          Write-Host ("{0}: {1}" -f ($i + 1), $lines[$i])
        }

    - name: Build AutomationDesigner
      run: msbuild AutomationDesigner.sln /p:Configuration=Release /p:SignManifests=false
