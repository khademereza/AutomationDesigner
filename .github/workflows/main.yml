name: Build AutomationDesigner

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:

    runs-on: windows-latest

    steps:
    - name: Checkout source code
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2
    - name: Restore NuGet packages
      run: nuget restore AutomationDesigner.sln
    - name: Build AutomationDesigner
      run: msbuild AutomationDesigner.sln /p:Configuration=Release
