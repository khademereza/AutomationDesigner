name: Build AutomationDesigner

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:

    runs-on: windows-latest

    steps:
    - name: Checkout source code
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2
    - name: Restore NuGet packages
      run: nuget restore AutomationDesigner.sln
    - name: Find VSTO OfficeTools
      shell: powershell
      run: |
        Write-Host "=== Visual Studio directories ==="
        Get-ChildItem "C:\Program Files\Microsoft Visual Studio" -Directory -Recurse -ErrorAction SilentlyContinue |
          Where-Object { $_.Name -eq "OfficeTools" } |
          Select-Object -ExpandProperty FullName

        Write-Host "=== VSTO targets files ==="
        Get-ChildItem "C:\Program Files\Microsoft Visual Studio" -File -Recurse -Filter "Microsoft.VisualStudio.Tools.Office.targets" -ErrorAction SilentlyContinue |
          Select-Object -ExpandProperty FullName

    - name: Build AutomationDesigner
      run: msbuild AutomationDesigner.sln /p:Configuration=Release /p:SignManifests=false
